# ==========================================
# tp-launch Configuration
# ==========================================

# --- Update ---
update.repo.url=https://github.com/tungttsmd/tp-net-client-release/archive/refs/heads/staging.zip
update.staging.timeout=30
update.backup.maxCount=2

# --- Watchdog ---
watchdog.maxRestarts=5
watchdog.restartDelay=1000
watchdog.waitForFatalCrash=1000
watchdog.launchDelay=5000

# --- Managed Processes ---

processes.0.name=tp-net-cloudflared-client-service
processes.0.cmd=current\\tp-net-cloudflared-client-service\\run.bat

processes.1.name=tp-net-libreHwMonitor
processes.1.cmd=current\\tp-net-libreHwMonitor\\run.bat

processes.2.name=tp-net-trigger
processes.2.cmd=current\\tp-net-trigger\\run.bat